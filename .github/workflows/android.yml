# Builds the signed GMS Android APK and publishes it as a GitHub Release
# (gms.apk + version.json). The server pulls it with ./update-apk.sh.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#              (create them with mobile/scripts/create-keystore.sh)
#   Variable:  APP_URL  (optional, default https://139-59-42-240.sslip.io)
#
# Run: Actions tab → "Android APK" → Run workflow. Also runs on pushes that change mobile/.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown to testers in the update prompt)"
        required: false
        default: "Bug fixes and improvements."
      mandatory:
        description: "Force testers to update (no 'Later' button)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APP_URL: ${{ vars.APP_URL || 'https://139-59-42-240.sslip.io' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Prints only set/missing + length — never the values.
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name — MISSING (add it under Settings → Secrets and variables → Actions → Repository secrets)"
              missing=1
            else
              echo "$name — set (${#value} characters)"
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/check.jks" 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the whole line from gms-release.jks.base64"; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/check.jks" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/check.jks"
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore — re-type it in the secret (no spaces / line breaks)"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/check.jks" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/check.jks"
            echo "::error::ANDROID_KEY_ALIAS not found in the keystore — it should be: gms"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/check.jks"
          echo "All signing secrets look good (keystore opens, alias found)."

      - name: Install Capacitor (only versions published 7+ days ago)
        run: npm install --no-audit --no-fund --before="$(date -u -d '7 days ago' +%Y-%m-%d)"

      - name: Point the app at the server
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.server.url = process.env.APP_URL;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
          '
          sed -i "s|__APP_URL__|${APP_URL}|g" www/offline.html
          cat capacitor.config.json

      - name: Generate Android project
        run: npx cap add android

      # Uses assets/icon-only.png, icon-foreground.png and icon-background.png
      # (adaptive icons need the background *image*, not just a colour).
      - name: App icons
        run: |
          npx capacitor-assets generate --android --splashBackgroundColor '#0f172a' --splashBackgroundColorDark '#0f172a'
          ls android/app/src/main/res/mipmap-xxxhdpi/
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png

      - name: Sync
        run: npx cap sync android

      - name: Set version ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
        run: |
          f=android/app/build.gradle
          sed -E -i "s/versionCode( =)? [0-9]+/versionCode\1 ${VERSION_CODE}/; s/versionName( =)? \"[^\"]*\"/versionName\1 \"${VERSION_NAME}\"/" "$f"
          grep -E "versionCode|versionName" "$f"
          grep -q "versionCode.*${VERSION_CODE}" "$f"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/gms.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p ../dist
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/gms.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out ../dist/gms.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ../dist/gms.apk | head -3
          rm -f "$RUNNER_TEMP/gms.jks"

      - name: Write version.json
        env:
          NOTES: ${{ github.event.inputs.notes || 'Bug fixes and improvements.' }}
          MANDATORY: ${{ github.event.inputs.mandatory || 'false' }}
        run: |
          node -e '
            require("fs").writeFileSync("../dist/version.json", JSON.stringify({
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              apkUrl: "/downloads/gms.apk",
              notes: process.env.NOTES,
              mandatory: process.env.MANDATORY === "true",
              publishedAt: new Date().toISOString(),
            }, null, 2));
          '
          cat ../dist/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: gms-android-${{ env.VERSION_NAME }}
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes || 'Automated build' }}
        run: |
          gh release create "android-v${VERSION_NAME}" ../dist/gms.apk ../dist/version.json \
            --title "GMS Android ${VERSION_NAME}" --notes "$NOTES" --latest
