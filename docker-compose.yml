services:
  db:
    image: postgres:16-alpine
    container_name: gms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gms_pgdata:/var/lib/postgresql/data
    ports:
      # localhost-only: never expose the database to the internet
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gms_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      UPLOAD_DIR: ${UPLOAD_DIR}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - gms_uploads:/app/uploads
    ports:
      # localhost-only: the API is reached publicly through nginx (:8080/api)
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time (defaults to relative "/api")
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: gms_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      # localhost-only: served publicly through nginx (:8080)
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: gms_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - gms_uploads:/var/uploads:ro
    ports:
      # Also expose on 8080 publicly as fallback (direct IP access)
      - "8080:80"
    depends_on:
      - frontend
      - backend

  # Cloudflare Tunnel — outbound HTTPS, no inbound ports 80/443 needed.
  # Set CLOUDFLARE_TUNNEL_TOKEN in .env to activate.
  # Leave CLOUDFLARE_TUNNEL_TOKEN empty to skip (app still works on :8080).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gms_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles:
      - tunnel

volumes:
  gms_pgdata:
  gms_uploads:
